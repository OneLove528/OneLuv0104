<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONE — Pre-Register</title>
<meta name="description" content="Pre-register for the OneLove ONE arcade stick.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap');

  :root{
    --black:#000;
    --white:#fff;
    --ink:#1d1d1f;
    --muted:#6e6e73;
    --line:rgba(29,29,31,.12);
    --ease:cubic-bezier(.16,.84,.44,1);
  }

  *{box-sizing:border-box}

  html{min-height:100%;background:var(--white)}

  body{
    min-height:100svh;
    margin:0;
    background:var(--white);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  a{color:inherit;text-decoration:none}

  .nav{
    position:fixed;inset:0 0 auto;z-index:20;height:64px;padding:0 28px;
    display:flex;align-items:center;justify-content:space-between;
    color:var(--ink);background:rgba(255,255,255,.82);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    box-shadow:0 1px 0 var(--line);
  }

  .nav__brand{display:block;width:78px;height:16px;position:relative;flex:none}
  .nav__brand img{position:absolute;inset:0;width:100%;height:16px;object-fit:contain}

  .nav__back{
    font-size:12px;letter-spacing:.02em;opacity:.82;
    transition:opacity .2s var(--ease);
  }
  .nav__back:hover{opacity:.42}

  .register{
    min-height:100svh;
    display:grid;
    place-items:center;
    padding:110px 24px 72px;
    background:
      radial-gradient(circle at 50% 38%,rgba(0,0,0,.035),rgba(0,0,0,0) 34%),
      var(--white);
  }

  .register__card{
    width:min(100%,520px);
    text-align:center;
  }

  .register__kicker{
    margin:0 0 16px;
    font-family:'Play',sans-serif;
    font-size:14px;
    font-weight:700;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .register__title{
    margin:0;
    font-size:clamp(48px,8vw,78px);
    font-weight:650;
    line-height:.96;
    letter-spacing:-.055em;
  }

  .register__copy{
    max-width:460px;
    margin:18px auto 34px;
    font-size:16px;
    line-height:1.55;
    color:var(--muted);
  }

  .register__form{
    width:100%;
    margin:0 auto;
    text-align:left;
  }

  .field{margin-bottom:14px}

  .field label{
    display:block;
    margin:0 0 7px;
    font-size:12px;
    font-weight:650;
    letter-spacing:.01em;
  }

  .field input{
    display:block;
    width:100%;
    min-height:52px;
    padding:14px 16px;
    border:1px solid rgba(29,29,31,.18);
    border-radius:14px;
    background:#f5f5f7;
    color:var(--ink);
    font:inherit;
    font-size:16px;
    outline:none;
    transition:border-color .2s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease);
  }

  .field input::placeholder{color:#9a9a9f}

  .field input:focus{
    background:#fff;
    border-color:var(--ink);
    box-shadow:0 0 0 4px rgba(29,29,31,.07);
  }

  .register__button{
    display:flex;
    width:100%;
    min-height:52px;
    margin-top:8px;
    align-items:center;
    justify-content:center;
    border:1px solid var(--ink);
    border-radius:999px;
    background:var(--ink);
    color:#fff;
    font:inherit;
    font-size:14px;
    font-weight:650;
    cursor:pointer;
    transition:transform .2s var(--ease),opacity .2s var(--ease);
  }

  .register__button:hover{transform:translateY(-2px);opacity:.88}
  .register__button:active{transform:translateY(0)}
  .register__button:disabled{opacity:.45;cursor:wait;transform:none}

  .message{
    min-height:22px;
    margin:18px 0 0;
    font-size:13px;
    line-height:1.45;
    text-align:center;
  }

  .message.success{color:#176b35}
  .message.error{color:#a52222}

  .register__note{
    margin:22px 0 0;
    font-size:10px;
    line-height:1.5;
    color:#8a8a8f;
  }

  @media(max-width:620px){
    .nav{padding:0 20px}
    .register{padding-inline:20px}
    .register__title{font-size:clamp(44px,14vw,64px)}
  }

  @media(prefers-reduced-motion:reduce){
    .nav__back,.register__button,.field input{transition:none}
  }
</style>
</head>

<main class="register">
  <section class="register__card" aria-labelledby="register-title">
    <p class="register__kicker">ONE / PRE-REGISTRATION</p>
    <h1 class="register__title" id="register-title">Be first in line.</h1>
    <p class="register__copy">
      Pre-register for the ONE arcade stick. We’ll let you know when it’s ready.
    </p>

    <form class="register__form" id="waitlistForm" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input
          id="name"
          name="name"
          type="text"
          autocomplete="name"
          placeholder="Your name"
          maxlength="120"
          required
        >
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
          maxlength="254"
          required
        >
      </div>

      <!-- Honeypot: hidden from normal users; bots that fill it are rejected. -->
      <div aria-hidden="true" style="position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden;">
        <label for="website">Website</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>

      <button class="register__button" id="submitButton" type="submit">
        Pre-Register
      </button>

      <p class="message" id="message" role="status" aria-live="polite"></p>
      <p class="register__note">
        Your details are used only for the ONE pre-registration list.
      </p>
    </form>
  </section>
</main>

<script>
(function(){
  'use strict';

  // Public submission endpoint. No Google Sheet ID, URL, or sheet data is exposed.
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLpzYzQNs33c-Z-FjR5YyPb_StnfzBmxedR8BjY66ND7AGy75rGjVv9heTbV1kOt0-/exec";

  var form = document.getElementById('waitlistForm');
  var submitButton = document.getElementById('submitButton');
  var message = document.getElementById('message');
  var honeypot = document.getElementById('website');

  function setMessage(text, type){
    message.textContent = text || '';
    message.className = 'message' + (type ? ' ' + type : '');
  }

  form.addEventListener('submit', async function(event){
    event.preventDefault();
    setMessage('');

    var name = document.getElementById('name').value.trim();
    var email = document.getElementById('email').value.trim();

    if (honeypot.value) {
      return;
    }

    if (!name) {
      setMessage('Please enter your name.', 'error');
      document.getElementById('name').focus();
      return;
    }

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      setMessage('Please enter a valid email address.', 'error');
      document.getElementById('email').focus();
      return;
    }

    submitButton.disabled = true;
    submitButton.textContent = 'Submitting…';

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        redirect: 'follow',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify({
          name: name,
          email: email
        })
      });

      form.reset();
      setMessage('You’re on the list. We’ll be in touch when ONE is ready.', 'success');
    } catch (error) {
      console.error(error);
      setMessage('Something went wrong. Please try again.', 'error');
    } finally {
      submitButton.disabled = false;
      submitButton.textContent = 'Pre-Register';
    }
  });
})();
</script>
