<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONE — Pre-Register</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      color: #1d1d1f;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 40px 32px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .kicker {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6e6e73;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 56px;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      color: #6e6e73;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #1d1d1f;
    }

    input[type="email"] {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      font-size: 15px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="email"]:focus {
      border-color: #0071e3;
    }

    button {
      width: 100%;
      height: 48px;
      background-color: #1d1d1f;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.88;
    }

    .success-message {
      display: none;
      font-size: 14px;
      color: #176b35;
      margin-top: 16px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="kicker">OneLove</div>
    <h1>ONE</h1>
    <p>Pre-register for the OneLove ONE arcade stick.</p>

    <form id="preRegisterForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" required>
      </div>
      <button type="submit">Pre-Register Now</button>
    </form>

    <div id="successMessage" class="success-message">
      You are pre-registered! We will notify you when ONE drops.
    </div>
  </div>

  <script>
    document.getElementById('preRegisterForm').addEventListener('submit', function(e) {
      e.preventDefault();
      this.style.display = 'none';
      document.getElementById('successMessage').style.display = 'block';
    });
  </script>

</body>
</html>
