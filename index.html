/* ============ Tokens ============ */
:root{
  --canvas:#fbfbfd;
  --ink:#1d1d1f;
  --void:#010101;
  --slate:#86868b;
  --hairline:#d2d2d7;
  --pulse:#ff2e8f;
  --nav-h:52px;
  --ease:cubic-bezier(.65,0,.35,1);
  --font-display:'Chakra Petch',-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}

/* ============ Reset ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
html,body{overflow-x:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  background:var(--canvas);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  line-height:1.4;
}
img{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}
button{font:inherit;background:none;border:0;cursor:pointer;}
::selection{background:var(--ink);color:var(--canvas);}
:focus-visible{outline:2px solid var(--pulse);outline-offset:3px;}

/* ============ Progressive-enhancement gates ============ */
.reveal{opacity:1;transform:none;}
.js:not(.reduced-motion) .reveal{
  opacity:0;
  transform:translateY(36px);
  transition:opacity .9s var(--ease),transform .9s var(--ease);
}
.js:not(.reduced-motion) .reveal.is-visible{opacity:1;transform:translateY(0);}
.js:not(.reduced-motion) .reveal.d1{transition-delay:.1s;}

/* ============ Nav ============ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  height:var(--nav-h);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;
  background:rgba(251,251,253,0);
  border-bottom:1px solid rgba(255,255,255,0);
  transition:background .5s var(--ease),border-color .5s var(--ease);
}
.nav.is-scrolled{
  background:rgba(251,251,253,.78);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid rgba(0,0,0,.07);
}
.nav__brand{position:relative;display:block;height:15px;}
.nav__brand img{position:absolute;top:0;left:0;height:15px;width:auto;transition:opacity .5s var(--ease);}
.nav__brand .is-light{opacity:1;}
.nav__brand .is-dark{opacity:0;}
.nav.is-scrolled .nav__brand .is-light{opacity:0;}
.nav.is-scrolled .nav__brand .is-dark{opacity:1;}

.nav__links{display:flex;gap:32px;list-style:none;}
.nav__links a{
  font-family:var(--font-mono);
  font-size:11px;font-weight:500;letter-spacing:.1em;
  color:rgba(255,255,255,.78);
  transition:color .5s var(--ease),opacity .2s ease;
}
.nav.is-scrolled .nav__links a{color:rgba(29,29,31,.72);}
.nav__links a:hover{opacity:.55;}
@media(max-width:620px){.nav__links{display:none;}}

/* ============ Hero — tall pin container + sticky 3D stage ============ */
.hero{
  height:190vh;
  background:var(--void);
}
.hero__stage{
  position:sticky;
  top:0;
  height:100vh;
  height:100svh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--nav-h) + 64px) 24px 100px;
  overflow:hidden;
  perspective:1400px;
}
.hero__glow{
  position:absolute;
  width:min(70vw,760px);height:min(70vw,760px);
  left:50%;top:52%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,var(--pulse) 0%,rgba(255,46,143,0) 68%);
  opacity:.16;filter:blur(50px);
  pointer-events:none;z-index:0;
}
.hero__text{position:relative;z-index:2;text-align:center;max-width:600px;margin:0 auto 44px;}
.hero__kicker{
  font-family:var(--font-mono);font-size:13px;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.7);margin-bottom:18px;
}
.hero__title{
  font-family:var(--font-display);
  font-size:clamp(52px,9.5vw,108px);font-weight:600;
  letter-spacing:0;line-height:1;color:#fff;margin-bottom:18px;
}
.hero__subtitle{
  font-family:var(--font-display);
  font-size:clamp(19px,2.6vw,26px);font-weight:400;
  letter-spacing:.005em;color:rgba(255,255,255,.7);
}

/* Floating product, treated as a tumbling 3D object:
   .hero__media  -> JS scroll-driven rise / scale / rotation / fade
   .hero__media-inner -> continuous CSS idle tumble (independent transform, no conflict) */
.hero__media{
  position:relative;z-index:2;width:100%;max-width:900px;
  will-change:transform,opacity;
  transform-style:preserve-3d;
}
.hero__media-inner{position:relative;will-change:transform;}
.js:not(.reduced-motion) .hero__media-inner{animation:floatBob3D 6s ease-in-out infinite;}
@keyframes floatBob3D{
  0%{transform:translateY(0) rotateX(8deg) rotateY(-14deg) rotateZ(0deg);}
  25%{transform:translateY(-12px) rotateX(4deg) rotateY(-6deg) rotateZ(.8deg);}
  50%{transform:translateY(-18px) rotateX(2deg) rotateY(2deg) rotateZ(0deg);}
  75%{transform:translateY(-12px) rotateX(5deg) rotateY(9deg) rotateZ(-.8deg);}
  100%{transform:translateY(0) rotateX(8deg) rotateY(-14deg) rotateZ(0deg);}
}
.hero__media-inner img{width:100%;height:auto;position:relative;z-index:1;}
.hero__media-shadow{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:56%;height:34px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.6) 0%,rgba(0,0,0,0) 72%);
  filter:blur(4px);z-index:0;
}
.js:not(.reduced-motion) .hero__media-shadow{animation:shadowPulse3D 6s ease-in-out infinite;}
@keyframes shadowPulse3D{
  0%,100%{transform:translateX(-50%) scale(1) skewX(0deg);opacity:.55;}
  25%{transform:translateX(-50%) scale(.88) skewX(-4deg);opacity:.4;}
  50%{transform:translateX(-50%) scale(.78) skewX(0deg);opacity:.28;}
  75%{transform:translateX(-50%) scale(.88) skewX(4deg);opacity:.4;}
}

.scroll-cue{
  position:absolute;bottom:32px;left:50%;transform:translateX(-50%);
  z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:opacity .3s ease;
}
.scroll-cue span{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(255,255,255,.45);
}
.scroll-cue__mark{
  width:14px;height:14px;
  border-right:1.5px solid rgba(255,255,255,.45);
  border-bottom:1.5px solid rgba(255,255,255,.45);
  transform:rotate(45deg);
}
.js:not(.reduced-motion) .scroll-cue__mark{animation:cue 2.2s ease-in-out infinite;}
@keyframes cue{
  0%,100%{transform:rotate(45deg) translate(0,0);opacity:.45;}
  50%{transform:rotate(45deg) translate(3px,3px);opacity:.9;}
}

@media(prefers-reduced-motion:no-preference){
  .js .hero__kicker{animation:fadeUp .8s var(--ease) both;animation-delay:.15s;}
  .js .hero__title{animation:fadeUp .9s var(--ease) both;animation-delay:.3s;}
  .js .hero__subtitle{animation:fadeUp .8s var(--ease) both;animation-delay:.45s;}
  .js .hero__media{animation:fadeUp 1.1s var(--ease) both;animation-delay:.6s;}
}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:translateY(0);}}

/* ============ Design — statement only, no imagery ============ */
.detail{padding:min(20vw,180px) 24px;max-width:820px;margin:0 auto;}
.detail__header{text-align:center;}
.detail__title{
  font-family:var(--font-display);
  font-size:clamp(34px,5.6vw,60px);font-weight:600;letter-spacing:0;line-height:1.15;
}

/* ============ Coming soon ============ */
.coming-soon{padding:min(20vw,180px) 24px min(20vw,180px);text-align:center;}
.coming-soon__mark-wrap{width:38px;margin:0 auto 30px;}
.coming-soon__mark{width:100%;height:auto;}
.js:not(.reduced-motion) .coming-soon__mark{animation:pulse 2.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85;}50%{transform:scale(1.1);opacity:1;}}
.coming-soon__title{
  font-family:var(--font-display);
  font-size:clamp(44px,8.4vw,92px);font-weight:600;letter-spacing:0;margin-bottom:18px;
}
.coming-soon__subtitle{font-family:var(--font-mono);font-size:14px;letter-spacing:.04em;color:var(--slate);}

/* ============ Footer ============ */
.footer{padding:44px 24px;border-top:1px solid var(--hairline);text-align:center;}
.footer__logo{height:13px;width:auto;margin:0 auto 14px;opacity:.65;}
.footer__copy{font-family:var(--font-mono);font-size:11px;letter-spacing:.03em;color:var(--slate);}

<script>
(function () {
  'use strict';

  var reduceMotion = document.documentElement.classList.contains('reduced-motion');
  var nav = document.getElementById('nav');
  var hero = document.getElementById('hero');
  var heroMedia = document.getElementById('heroMedia');
  var heroText = document.getElementById('heroText');
  var scrollCue = document.getElementById('scrollCue');

  /* Progress (0 -> 1) through the hero's pinned scroll range, independent
     of the exact height chosen -- reads live layout each call. */
  function heroProgress() {
    var rect = hero.getBoundingClientRect();
    var scrollable = hero.offsetHeight - window.innerHeight;
    if (scrollable <= 0) return 0;
    var p = -rect.top / scrollable;
    return Math.min(Math.max(p, 0), 1);
  }

  var ticking = false;

  function update() {
    ticking = false;
    var progress = heroProgress();

    /* Nav stays in its transparent, over-dark state for the entire pin --
       only switches once the black hero has actually given way to white. */
    if (progress >= 0.94) {
      nav.classList.add('is-scrolled');
    } else {
      nav.classList.remove('is-scrolled');
    }

    if (!reduceMotion) {
      /* The object rises, grows, and tumbles in 3D as you scroll through
         the pin -- then dissolves in the last stretch so the release into
         the white section never looks like a hard cut. */
      var mediaY = progress * -150;
      var mediaScale = 1 + progress * 0.18;
      var mediaRotX = progress * -8;
      var mediaRotY = progress * 22;
      var mediaRotZ = progress * 3;
      var mediaOpacity = progress < 0.6 ? 1 : Math.max(0, 1 - (progress - 0.6) / 0.4);

      heroMedia.style.transform =
        'translateY(' + mediaY.toFixed(1) + 'px) ' +
        'scale(' + mediaScale.toFixed(3) + ') ' +
        'rotateX(' + mediaRotX.toFixed(2) + 'deg) ' +
        'rotateY(' + mediaRotY.toFixed(2) + 'deg) ' +
        'rotateZ(' + mediaRotZ.toFixed(2) + 'deg)';
      heroMedia.style.opacity = String(mediaOpacity);

      var textY = progress * -70;
      var textOpacity = 1 - Math.min(progress / 0.45, 1);
      heroText.style.transform = 'translateY(' + textY.toFixed(1) + 'px)';
      heroText.style.opacity = String(textOpacity);

      if (scrollCue) {
        scrollCue.style.opacity = String(1 - Math.min(progress / 0.12, 1));
      }
    }
  }

  function onScroll() {
    if (!ticking) {
      window.requestAnimationFrame(update);
      ticking = true;
    }
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  update();

  /* ---- Scroll-triggered reveals (Design / Coming Soon) ---- */
  var revealEls = document.querySelectorAll('.reveal');

  if (reduceMotion || !('IntersectionObserver' in window)) {
    revealEls.forEach(function (el) {
      el.classList.add('is-visible');
    });
  } else {
    var io = new IntersectionObserver(
      function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            io.unobserve(entry.target);
          }
        });
      },
      { threshold: 0.18, rootMargin: '0px 0px -8% 0px' }
    );

    revealEls.forEach(function (el) {
      io.observe(el);
    });
  }
})();

</script>
